<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レッスン管理 - ペラトレ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'BIZ UDGothic', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
            background: #F1F1F1;
            color: #423929;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            background: white;
            min-height: calc(100vh - 40px);
        }

        .header {
            border-bottom: 1px solid #d0d0d0;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            color: #423929;
        }

        .breadcrumb a {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #423929;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            color: #A296AF;
        }

        .breadcrumb .separator {
            color: #7a6f5d;
        }

        .breadcrumb .current {
            color: #A296AF;
        }

        .title-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 400;
            color: #423929;
            flex: 1;
            text-align: center;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 400;
            color: #423929;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e8e8e8;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e8e8e8;
        }

        .section-header h2 {
            font-size: 1.1rem;
            font-weight: 400;
            color: #423929;
        }

        /* フォームレイアウト */
        .form-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-row.compact {
            flex-wrap: wrap;
        }

        .lesson-number-display {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            padding: 8px 12px;
            background: #A296AF;
            color: white;
            font-size: 0.85rem;
            border-radius: 2px;
            font-weight: 400;
        }

        .date-selects {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .date-selects select {
            padding: 8px 10px;
            border: 1px solid #d8d8d8;
            border-radius: 2px;
            font-size: 0.9rem;
            color: #423929;
            background: white;
            font-family: 'BIZ UDGothic', sans-serif;
        }

        .date-selects span {
            color: #7a6f5d;
            font-size: 0.9rem;
        }

        select#instructor,
        input#instructor {
            padding: 8px 12px;
            border: 1px solid #d8d8d8;
            border-radius: 2px;
            font-size: 0.9rem;
            color: #423929;
            background: white;
            font-family: 'BIZ UDGothic', sans-serif;
            min-width: 150px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #d8d8d8;
            border-radius: 2px;
            font-size: 0.9rem;
            color: #423929;
            font-family: 'BIZ UDGothic', sans-serif;
        }

        .input-label {
            min-width: 120px;
            color: #7a6f5d;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #A296AF;
        }

        /* お休みチェックボックス */
        .cancelled-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .cancelled-checkbox input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #d8d8d8;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .cancelled-checkbox input[type="checkbox"]:checked {
            background: #A296AF;
            border-color: #A296AF;
        }

        .cancelled-checkbox input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .cancelled-checkbox-text {
            color: #7a6f5d;
            font-size: 0.9rem;
        }

        .note-input {
            width: 140px;
            padding: 8px 10px;
            border: 1px solid #d8d8d8;
            border-radius: 2px;
            font-size: 0.85rem;
            font-family: 'BIZ UDGothic', sans-serif;
        }

        .note-input:focus {
            outline: none;
            border-color: #A296AF;
        }

        /* ボタン */
        button, .btn {
            padding: 10px 20px;
            border: 1px solid #A296AF;
            background: white;
            color: #A296AF;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
            font-family: 'BIZ UDGothic', sans-serif;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .btn:hover {
            background: #A296AF;
            color: white;
        }

        .btn-primary {
            background: #A296AF;
            color: white;
            border-color: #A296AF;
        }

        .btn-primary:hover {
            background: #8a7e9a;
            border-color: #8a7e9a;
        }

        .btn-upload {
            white-space: nowrap;
        }

        .filename-display {
            font-size: 0.9rem;
            color: #423929;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        /* 既存レッスン一覧 */
        .lesson-list {
            margin-top: 20px;
        }

        .lesson-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e8e8e8;
            gap: 20px;
        }

        .lesson-row:hover {
            background: #f9f9f9;
        }

        .lesson-cell {
            color: #423929;
            font-size: 0.9rem;
        }

        .lesson-cell.number {
            min-width: 80px;
            font-weight: 400;
        }

        .lesson-cell.date {
            min-width: 100px;
            color: #7a6f5d;
        }

        .lesson-cell.instructor {
            flex: 1;
            color: #7a6f5d;
        }

        .cancelled-label {
            display: inline-block;
            background: #f5f3f7;
            color: #A296AF;
            padding: 2px 8px;
            border-radius: 2px;
            font-size: 0.8rem;
            margin-left: 8px;
        }

        .note-label {
            color: #7a6f5d;
            font-size: 0.8rem;
            margin-left: 8px;
        }

        .lesson-actions {
            display: flex;
            gap: 8px;
        }

        .lesson-actions button {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        /* ページネーション */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            padding-top: 20px;
        }

        .pagination button {
            min-width: 35px;
            padding: 6px 10px;
            font-size: 0.85rem;
        }

        .pagination button.active {
            background: #A296AF;
            color: white;
        }

        .pagination button.dots {
            border: none;
            cursor: default;
        }

        .pagination button.dots:hover {
            background: white;
            color: #A296AF;
        }

        /* LINE送信用テキスト */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .accordion-content.open {
            max-height: 2000px;
        }

        .accordion-icon {
            transition: transform 0.3s;
            font-size: 0.8rem;
            color: #7a6f5d;
        }

        .accordion-icon.open {
            transform: rotate(180deg);
        }

        .line-text-display {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 2px;
            margin-top: 15px;
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 0.9rem;
            color: #423929;
        }

        /* メッセージ */
        .success-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #A296AF;
            color: white;
            padding: 20px 40px;
            border-radius: 2px;
            font-size: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: none;
            z-index: 9999;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7a6f5d;
            font-size: 0.95rem;
        }

        /* プログレスバー */
        #uploadProgress,
        #memoUploadProgress {
            display: none;
            margin-top: 10px;
            background: #e8e8e8;
            border-radius: 2px;
            overflow: hidden;
            height: 6px;
        }

        .progress-bar {
            height: 100%;
            background: #A296AF;
            transition: width 0.3s;
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
            }

            h1 {
                text-align: left;
                font-size: 1.3rem;
            }

            .form-row.compact {
                flex-direction: column;
                align-items: stretch;
            }

            .date-selects {
                width: 100%;
            }

            select#instructor,
            input#instructor {
                width: 100%;
            }

            .lesson-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .lesson-actions {
                width: 100%;
            }

            .action-buttons {
                flex-direction: column;
            }
        }

        /* パスワード保護 */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F1F1F1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .auth-box {
            background: white;
            padding: 50px 40px;
            text-align: center;
            max-width: 360px;
            width: 90%;
        }
        .auth-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            opacity: 0.4;
            object-fit: contain;
        }
        .auth-title {
            font-size: 1.1rem;
            color: #423929;
            margin-bottom: 25px;
            font-weight: 400;
        }
        .auth-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d8d8d8;
            border-radius: 2px;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-family: 'BIZ UDGothic', sans-serif;
        }
        .auth-input:focus {
            outline: none;
            border-color: #A296AF;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: white;
            color: #A296AF;
            border: 1px solid #A296AF;
            border-radius: 2px;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: 'BIZ UDGothic', sans-serif;
            transition: all 0.2s;
        }
        .auth-btn:hover {
            background: #A296AF;
            color: white;
        }
        .auth-error {
            color: #c44;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }

        /* ===== サイドバー ===== */
        #pageLayout { max-width: 1200px; margin: 0 auto; }
        .container { margin: 0 auto; max-width: 1200px; min-width: 0; display: flex; flex-direction: column; padding: 0; }
        .container > .header { padding: 20px 40px; border-bottom: 1px solid #d0d0d0; margin-bottom: 0; }
        .container-body { display: flex; flex: 1; }
        #sidebarNav {
            width: 200px;
            min-width: 200px;
            background: white;
            padding: 20px 8px 12px 8px;
            border-right: 1px solid #e0dde3;
        }
        .sidebar-title { font-size: 0.7rem; color: #b0a898; padding: 0 10px 8px 10px; letter-spacing: 0.05em; }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            margin-bottom: 2px;
            border-radius: 4px;
            text-decoration: none;
            transition: background 0.15s;
        }
        .sidebar-item:hover { background: #f3f0f8; }
        .sidebar-item.active {
            background: #f3f0f8;
            border-left: 3px solid #A296AF;
            padding-left: 7px;
        }
        .sidebar-num { font-size: 0.75rem; color: #b0a898; min-width: 16px; flex-shrink: 0; }
        .sidebar-name { font-size: 0.9rem; color: #423929; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .container-content { flex: 1; padding: 24px 40px 40px; min-width: 0; }
    </style>
</head>
<body>
<div id="pageLayout">
    <!-- パスワード認証オーバーレイ -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <img src="icon_key.png" alt="" class="auth-icon">
            <div class="auth-title">Lesson Archive管理</div>
            <input type="password" id="authPassword" class="auth-input" placeholder="パスワード" onkeypress="if(event.key==='Enter')checkAuth()">
            <button class="auth-btn" onclick="checkAuth()">ログイン</button>
            <div id="authError" class="auth-error">パスワードが違います</div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div class="breadcrumb">
                <a href="admin-VideoManagement00.html">
                    <img src="icon_movie.png" alt="" class="title-icon">
                    <span>Lesson Archive管理</span>
                </a>
                <span class="separator">＞</span>
                <span class="current" id="pageTitle">レッスン管理</span>
                <button class="btn" onclick="openMyPortal()" id="myportalBtnHeader" style="display:none; margin-left:12px; padding:5px 14px; font-size:0.8rem;">myportal</button>
            </div>
        </div>
        <div class="container-body">
        <div id="sidebarNav"><div class="sidebar-title">受講生</div></div>
        <div class="container-content">
        <div id="successMessage" class="success-message"></div>

        <!-- レッスン追加フォーム -->
        <div class="section">
            <div class="section-title">新しいレッスンを追加</div>

            <div class="form-row compact">
                <span class="lesson-number-display" id="lessonNumberDisplay">Lesson 1</span>
                <div class="date-selects">
                    <select id="dateYear"></select>
                    <span>年</span>
                    <select id="dateMonth"></select>
                    <span>月</span>
                    <select id="dateDay"></select>
                    <span>日</span>
                </div>
                <select id="instructor">
                    <option value="">講師を選択</option>
                </select>
                <label class="cancelled-checkbox">
                    <input type="checkbox" id="cancelled">
                    <span class="cancelled-checkbox-text">お休み</span>
                </label>
                <input type="text" id="note" class="note-input" placeholder="備考（15文字）" maxlength="15">
            </div>

            <div class="form-row" style="align-items: flex-start;">
                <label class="input-label" style="padding-top: 10px;">動画URL</label>
                <div id="videoUrlList" style="flex: 1; display: flex; flex-direction: column; gap: 6px;"></div>
            </div>

            <div class="form-row" style="align-items: flex-start;">
                <label class="input-label" style="padding-top: 10px;">メモURL</label>
                <div id="memoUrlList" style="flex: 1; display: flex; flex-direction: column; gap: 6px;"></div>
            </div>

            <div class="action-buttons">
                <button onclick="resetForm()">戻る</button>
                <button class="btn-primary" onclick="saveLesson()">レッスンを保存</button>
            </div>
        </div>

        <!-- LINEテキスト -->
        <div class="section" style="background:#f5f2f9;padding:16px 20px;border-radius:4px;margin-top:40px;margin-bottom:12px">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div class="accordion-header" onclick="toggleUploadTextAccordion()" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <span class="section-title" style="border: none; margin: 0; padding: 0;">アップロード用テキスト</span>
                    <span class="accordion-icon" id="uploadTextAccordionIcon">▼</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-primary" onclick="openLineChat()" id="lineButton" style="display:none;padding:10px 14px;font-size:0.82rem;">🔗 LINEで送信</button>
                    <button onclick="copyLineTextFromPage()" style="padding:10px 14px;font-size:0.82rem;">テキストをコピー</button>
                </div>
            </div>
            <div class="accordion-content" id="uploadTextAccordionContent">
                <div class="line-text-display" id="lineTextDisplay">読み込み中...</div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
                <div class="accordion-header" onclick="toggleFirstGuideTextAccordion()" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <span class="section-title" style="border: none; margin: 0; padding: 0;">初回案内用テキスト</span>
                    <span class="accordion-icon" id="firstGuideTextAccordionIcon">▼</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-primary" onclick="openLineChatFirstGuide()" id="lineButtonFirstGuide" style="display:none;padding:10px 14px;font-size:0.82rem;">🔗 LINEで送信</button>
                    <button onclick="copyFirstGuideText()" style="padding:10px 14px;font-size:0.82rem;">テキストをコピー</button>
                </div>
            </div>
            <div class="accordion-content" id="firstGuideTextAccordionContent">
                <div class="line-text-display" id="firstGuideTextDisplay">読み込み中...</div>
            </div>
        </div>

        <!-- 既存レッスン一覧 -->
        <div class="section" style="margin-top:48px">
            <div class="section-header">
                <h2>既存レッスン一覧</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" onclick="renumberLessons()">番号振り直し</button>
                    <button class="btn" onclick="openMyPortal()" id="myportalBtn" style="display:none;">myportal</button>
                </div>
            </div>
            <div id="lessonList" class="lesson-list">
                <div class="empty-state">まだレッスンが登録されていません</div>
            </div>
            <div id="pagination" class="pagination"></div>
        </div>
    </div>

    <script>
        const SCHEDULE_API_URL = '/api/legacy/gas'; // GAS のURL・キーはサーバー側にだけある

        let currentStudentId = null;
        let currentStudentName = '';
        let currentLineName = '';
        let currentAccessKey = '';
        let currentLineUrl = '';
        let currentPpUrl = '';
        let editingLessonNumber = null;
        let allLessons = [];
        let currentPage = 1;
        const lessonsPerPage = 5;
        let allTemplates = {};

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            loadSidebar();
            const params = new URLSearchParams(window.location.search);
            currentStudentId = params.get('student');
            
            if (!currentStudentId) {
                alert('生徒IDが指定されていません');
                location.href = 'admin-VideoManagement00.html';
                return;
            }

            generateDateSelects();
            initUrlList('video');
            initUrlList('memo');
            loadInstructors();
            loadStudentData();
            setTodayDate();
        });

        // 日付プルダウンを生成
        function generateDateSelects() {
            const yearSelect = document.getElementById('dateYear');
            for (let year = 2025; year <= 2035; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            }

            const monthSelect = document.getElementById('dateMonth');
            for (let month = 1; month <= 12; month++) {
                const option = document.createElement('option');
                option.value = month;
                option.textContent = month;
                monthSelect.appendChild(option);
            }

            const daySelect = document.getElementById('dateDay');
            for (let day = 1; day <= 31; day++) {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = day;
                daySelect.appendChild(option);
            }
        }

        // 講師一覧を読み込み
        async function loadInstructors() {
            try {
                const response = await fetch('/api/legacy/store/students?t=' + new Date().getTime());
                const data = await response.json();
                
                const instructors = data.instructors || [];
                const instructorDatalist = document.getElementById('instructorList');
                
                instructors.forEach(instructor => {
                    const option = document.createElement('option');
                    option.value = instructor;
                    instructorDatalist.appendChild(option);
                });
            } catch (error) {
                console.log('講師データの読み込みをスキップしました');
            }
        }

        // 生徒データ読み込み
        async function loadStudentData() {
            try {
                const response = await fetch('/api/legacy/store/students?t=' + new Date().getTime());
                const data = await response.json();
                const students = data.students || data;
                allTemplates = data.templates || {};
                
                const student = students.find(s => s.id == currentStudentId);
                
                if (!student) {
                    alert('生徒が見つかりません');
                    location.href = 'admin-VideoManagement00.html';
                    return;
                }

                currentStudentName = student.name;
                currentLineName = student.lineName || '';
                currentAccessKey = student.accessKey;
                currentLineUrl = student.lineUrl || '';
                currentPpUrl = student.ppUrl || '';
                
                // LINEボタンの表示/非表示
                const lineButton = document.getElementById('lineButton');
                const lineButtonFirstGuide = document.getElementById('lineButtonFirstGuide');
                if (currentLineUrl) {
                    lineButton.style.display = 'inline-block';
                    lineButtonFirstGuide.style.display = 'inline-block';
                } else {
                    lineButton.style.display = 'none';
                    lineButtonFirstGuide.style.display = 'none';

        // 今日の日付をセット
        // スプシから次回レッスンを取得してフォームに初期値セット
        async function prefillNextLesson() {
            if (!SCHEDULE_API_URL || SCHEDULE_API_URL === 'ここにデプロイURLを貼り付け') return;
            try {
                const GAS_CACHE_KEY = 'gas_schedule_cache';
                let lessons;
                const cached = sessionStorage.getItem(GAS_CACHE_KEY);
                if (cached) {
                    const allItems = JSON.parse(cached);
                    lessons = allItems.filter(item => String(item.studentId) === String(currentStudentId));
                } else {
                    const res = await fetch(`${SCHEDULE_API_URL}?studentId=${currentStudentId}`);
                    lessons = await res.json();
                }
                if (!Array.isArray(lessons) || lessons.length === 0) return;

                const today = new Date();
                today.setHours(0, 0, 0, 0);

                // 登録済み日付セット＆最新登録日を取得
                const registeredDates = new Set(allLessons.map(l => l.date));
                const toDate = str => { const p = str.split('.').map(Number); return new Date(p[0], p[1]-1, p[2]); };
                const latestRegistered = allLessons
                    .map(l => l.date).filter(d => d)
                    .sort((a, b) => toDate(b) - toDate(a))[0];

                // 最新登録日より後の未登録レッスンを探す（登録なしなら全件対象）
                const next = lessons
                    .filter(l => {
                        if (!l.rawDate) return false;
                        if (registeredDates.has(l.rawDate)) return false;
                        if (!latestRegistered) return true;
                        return toDate(l.rawDate) > toDate(latestRegistered);
                    })
                    .sort((a, b) => toDate(a.rawDate) - toDate(b.rawDate))[0];

                if (!next) return;

                // 日付セット（rawDateを直接使用）
                const parts = next.rawDate.split('.');
                document.getElementById('dateYear').value  = parts[0];
                document.getElementById('dateMonth').value = parseInt(parts[1]);
                document.getElementById('dateDay').value   = parseInt(parts[2]);

                // 講師セット（C列: "〇〇先生"）
                if (next.title) {
                    // "〇〇さん／Tomoyo先生" → "Tomoyo先生" を抽出
                    const parts = next.title.split(/[／\/]/);
                    const instructor = parts[parts.length - 1].trim();
                    const instructorSelect = document.getElementById('instructor');
                    for (let opt of instructorSelect.options) {
                        if (opt.value === instructor) {
                            instructorSelect.value = instructor;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.log('スプシ連携スキップ:', e);
            }
        }

        // "5月 14日 (水) · 10:00" → "2026-05-14" 形式に変換
        function formatScheduleDate(raw) {
            if (!raw) return null;
            const m = raw.match(/(\d+)月\s*(\d+)日/);
            if (!m) return null;
            const month = parseInt(m[1]);
            const day   = parseInt(m[2]);
            const today = new Date();
            let year = today.getFullYear();
            const candidate = new Date(year, month - 1, day);
            if (candidate < new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1)) {
                year += 1;
            }
            return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        }

            // 新しい順にソート
            const sortedLessons = [...allLessons].sort((a, b) => b.lessonNumber - a.lessonNumber);

            // ページネーション計算
            const totalPages = Math.ceil(sortedLessons.length / lessonsPerPage);
            const startIndex = (currentPage - 1) * lessonsPerPage;
            const endIndex = startIndex + lessonsPerPage;
            const lessonsToDisplay = sortedLessons.slice(startIndex, endIndex);

            listElement.innerHTML = lessonsToDisplay.map(lesson => {
                const instructor = lesson.instructor || '';
                const cancelledLabel = lesson.cancelled ? '<span class="cancelled-label">お休み</span>' : '';
                const noteLabel = lesson.note ? `<span class="note-label">${lesson.note}</span>` : '';
                return `

        // ページネーション表示
        function renderPagination(totalPages) {
            const paginationElement = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                paginationElement.innerHTML = '';
                return;
            }

            let html = '';

            // ページ番号の表示ロジック
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    const activeClass = i === currentPage ? 'active' : '';
                    html += `<button class="${activeClass}" onclick="goToPage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<button class="dots">...</button>`;
                }
            }

            paginationElement.innerHTML = html;
        }

        // Google Driveからファイル名を取得
        var fetchTimeouts = {};
        async function fetchFileName(inputId, displayId) {
            const url = document.getElementById(inputId).value.trim();
            const display = document.getElementById(displayId);
            
            // 前回のタイムアウトをクリア
            if (fetchTimeouts[inputId]) {
                clearTimeout(fetchTimeouts[inputId]);
            }
            
            // 空の場合はクリア
            if (!url) {
                display.textContent = '';
                return;
            }
            
            // Google DriveのURLかチェック
            if (!url.includes('drive.google.com') && !url.includes('docs.google.com')) {
                display.textContent = '';
                return;
            }
            
            // 入力が落ち着くまで少し待つ
            fetchTimeouts[inputId] = setTimeout(async () => {
                display.textContent = '読み込み中...';
                
                try {
                    const response = await fetch('/api/legacy/filename?url=' + encodeURIComponent(url));
                    const data = await response.json();
                    
                    if (data.success && data.filename) {
                        display.textContent = data.filename;
                    } else {
                        display.textContent = '';
                    }
                } catch (error) {
                    display.textContent = '';
                }
            }, 500);
        }

            } catch(e) {}
        }

        async function checkAuth() {
            const input = document.getElementById('authPassword').value;
            const r = await fetch('/api/legacy/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: input }) }).catch(() => null);
            if (r && r.ok) {
                sessionStorage.setItem(AUTH_KEY, 'true');
                location.reload();
                document.getElementById('authOverlay').style.display = 'none';
            } else {
                document.getElementById('authError').style.display = 'block';
                document.getElementById('authPassword').value = '';
            }
        }
        
        // 認証済みならオーバーレイを非表示
        if (sessionStorage.getItem(AUTH_KEY) === 'true') {
            document.getElementById('authOverlay').style.display = 'none';
        } else {
            document.getElementById('authPassword').focus();
        }
    </script>
    </div>
</div>
</div>
</div>
