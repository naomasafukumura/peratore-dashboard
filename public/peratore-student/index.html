<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ペラトレ受講生管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --accent: #A296AF;
  --accent-dark: #8a7e9a;
  --bg: #F1F1F1;
  --text: #423929;
  --sub: #7a6f5d;
  --border: #d8d8d8;
  --border-light: #eeecf0;
}

body {
  font-family: 'BIZ UDGothic', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
}

/* ===== LOGIN ===== */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}
.login-box {
  background: white;
  padding: 50px 40px;
  width: 360px;
  max-width: 90%;
  text-align: center;
}
.login-icon {
  width: 40px;
  height: 40px;
  margin: 0 auto 20px;
  opacity: 0.4;
  object-fit: contain;
}
.login-title { font-size: 1.1rem; font-weight: 400; color: var(--text); margin-bottom: 25px; }
.login-input {
  width: 100%;
  padding: 12px 15px;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 1rem;
  font-family: inherit;
  color: var(--text);
  margin-bottom: 20px;
  outline: none;
  text-align: center;
  letter-spacing: 3px;
}
.login-input:focus { border-color: var(--accent); }
.login-btn {
  width: 100%;
  padding: 12px;
  background: white;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 0.95rem;
  font-family: inherit;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.2s;
}
.login-btn:hover { background: var(--accent); color: white; }
.login-error { color: #c44; font-size: 0.85rem; margin-top: 15px; display: none; }

/* ===== APP ===== */
.app { display: none; flex-direction: column; height: 100vh; max-width: 1200px; margin: 0 auto; }

/* ===== HEADER ===== */
.header {
  height: 56px;
  background: white;
  border-bottom: 2px solid var(--accent);
  display: flex;
  align-items: center;
  padding: 0 20px;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 50;
}
.header-title {
  font-size: 1rem;
  font-weight: 400;
  cursor: pointer;
  user-select: none;
  transition: color 0.2s;
}
.header-title:hover { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 8px; }
.role-badge {
  font-size: 0.78rem;
  color: var(--sub);
  background: var(--bg);
  padding: 3px 10px;
  border-radius: 2px;
}

/* ===== LAYOUT ===== */
.layout { display: flex; flex: 1; overflow: hidden; }

/* ===== SIDEBAR ===== */
.sidebar {
  width: 210px;
  min-width: 210px;
  max-width: 210px;
  background: white;
  border-right: 1px solid var(--border);
  overflow-y: scroll;
  overflow-x: hidden;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
.sidebar-search { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
.sidebar-search input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 0.82rem;
  font-family: inherit;
  color: var(--text);
  outline: none;
}
.sidebar-search input:focus { border-color: var(--accent); }

.s-section { border-bottom: 1px solid var(--border-light); }
.s-header {
  padding: 9px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 0.85rem;
  user-select: none;
  transition: background 0.15s;
}
.s-header:hover { background: #faf9fb; }
.s-arrow { font-size: 0.65rem; color: var(--accent); transition: transform 0.2s; flex-shrink: 0; }
.s-count { font-size: 0.75rem; color: var(--sub); margin-left: auto; }
.s-body { display: none; }
.s-body.open { display: block; }

.s-item {
  padding: 6px 12px 6px 22px;
  font-size: 0.82rem;
  color: var(--sub);
  cursor: pointer;
  transition: background 0.15s;
}
.s-item:hover { background: #faf9fb; color: var(--text); }
.s-item.active { background: #f5f3f7; color: var(--accent); font-weight: 500; }
.s-item.s-link { color: var(--accent); }
.p-nav-item {
  padding: 9px 12px;
  font-size: 0.85rem;
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
}
.p-nav-item:hover { background: #faf9fb; }
.p-nav-item.active { background: #f5f3f7; color: var(--accent); font-weight: 500; }
.s-dash-btn {
  display: inline-block;
  margin: 2px 8px 6px 20px;
  padding: 3px 12px;
  font-size: 0.78rem;
  color: var(--accent);
  background: white;
  border: 1px solid var(--accent);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
}
.s-dash-btn:hover { background: var(--accent); color: white; }
.s-dash-btn.active { background: var(--accent); color: white; }

/* ===== CONTENT ===== */
.content { flex: 1; overflow-y: auto; padding: 24px; background: var(--bg); }

/* ===== BUTTONS ===== */
.btn {
  padding: 7px 14px;
  border: 1px solid var(--accent);
  background: white;
  color: var(--accent);
  font-size: 0.82rem;
  cursor: pointer;
  border-radius: 2px;
  font-family: inherit;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
  white-space: nowrap;
  line-height: 1.4;
  vertical-align: middle;
  box-sizing: border-box;
}
.btn:hover { background: var(--accent); color: white; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
.btn-sm { padding: 0 10px; font-size: 0.78rem; height: 28px; line-height: 28px; }
button.btn { -webkit-appearance: none; appearance: none; }
.btn-danger { border-color: #c0392b; color: #c0392b; }
.btn-danger:hover { background: #c0392b; color: white; border-color: #c0392b; }

/* ===== CARD ===== */
.card { background: white; margin-bottom: 12px; padding: 22px 26px; }

/* ===== DETAIL ===== */
.det-name { font-size: 1.4rem; font-weight: 400; margin-bottom: 4px; }
.det-meta { font-size: 0.88rem; color: var(--sub); }

.sec-title {
  font-size: 0.85rem;
  color: var(--sub);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 14px;
  margin-top: 22px;
}
.sec-title:first-child { margin-top: 0; }

.inst-grid {
  display: grid;
  grid-template-columns: 90px 36px auto;
  gap: 5px 16px;
  font-size: 0.9rem;
  width: fit-content;
  align-items: center;
}

.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ===== TABS ===== */
.tab-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tab-btn {
  padding: 4px 12px;
  border: 1px solid var(--accent);
  background: white;
  color: var(--accent);
  font-size: 0.78rem;
  cursor: pointer;
  border-radius: 2px;
  font-family: inherit;
  transition: all 0.2s;
}
.tab-btn.active, .tab-btn:hover { background: var(--accent); color: white; }

/* ===== LESSON ROWS ===== */
.lesson-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 0.86rem;
}
.lesson-row:last-child { border-bottom: none; }
.lesson-date { color: var(--text); min-width: 140px; }
.lesson-inst { color: var(--sub); font-size: 0.8rem; }

.hist-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 0.84rem;
}
.hist-row:last-child { border-bottom: none; }
.hist-num {
  min-width: 72px;
  font-size: 0.75rem;
  color: white;
  background: var(--accent);
  padding: 2px 6px;
  border-radius: 2px;
  text-align: center;
  flex-shrink: 0;
}
.hist-num.cancelled { background: #bbb; }
.hist-date { color: var(--sub); min-width: 90px; }
.hist-inst { color: var(--sub); font-size: 0.8rem; flex: 1; }
.hist-links { display: flex; gap: 5px; margin-left: auto; }
.hist-tag {
  font-size: 0.72rem;
  padding: 1px 6px;
  border-radius: 2px;
  flex-shrink: 0;
}
.hist-tag-cancel { background: #f5f5f5; color: #999; border: 1px solid #ddd; }
.hist-tag-note { background: #f0eef4; color: var(--accent); border: 1px solid var(--border-light); }

.show-more {
  display: block;
  width: 100%;
  text-align: center;
  padding: 7px;
  color: var(--accent);
  font-size: 0.8rem;
  cursor: pointer;
  border: none;
  background: none;
  font-family: inherit;
  margin-top: 2px;
}
.show-more:hover { text-decoration: underline; }

/* ===== NOTE ===== */
.note-area { font-size: 0.86rem; color: var(--text); white-space: pre-wrap; line-height: 1.7; min-height: 24px; }
.note-empty { color: #c0b8c8; font-size: 0.82rem; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: white; padding: 10px 24px;
  border-radius: 20px; font-size: 0.88rem; opacity: 0;
  transition: opacity 0.3s; pointer-events: none; z-index: 9999;
}
.toast.show { opacity: 1; }
.note-ta {
  width: 100%;
  min-height: 70px;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-family: inherit;
  font-size: 0.86rem;
  color: var(--text);
  resize: vertical;
  outline: none;
}
.note-ta:focus { border-color: var(--accent); }

/* ===== TABLE ===== */
.tbl-wrap { background: white; overflow-x: auto; }
table { width: auto; min-width: 100%; border-collapse: collapse; font-size: 0.83rem; white-space: nowrap; }
thead th {
  padding: 9px 13px;
  text-align: center;
  background: #faf9fb;
  color: var(--sub);
  font-weight: 400;
  border-bottom: 1px solid var(--border);
}
.tbl-wrap thead th {
  position: sticky;
  top: 0;
}
tbody td { padding: 8px 13px; border-bottom: 1px solid var(--border-light); vertical-align: middle; text-align: center; }
.td-left { text-align: left; }
.note-cell { text-align: left; font-size: 0.8rem; color: var(--text); white-space: normal; max-width: 200px; }
tbody tr:hover { background: #faf9fb; }
tbody tr:last-child td { border-bottom: none; }
.filter-sel {
  padding: 4px 8px;
  border: 1px solid var(--accent);
  border-radius: 12px;
  font-size: 0.78rem;
  color: var(--accent);
  background: white;
  font-family: inherit;
  color: var(--sub);
  background: white;
  outline: none;
  margin-left: 4px;
}

/* ===== MODAL ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.overlay.open { display: flex; }
.modal {
  background: white;
  width: 500px;
  max-width: 95vw;
  max-height: 88vh;
  overflow-y: auto;
  padding: 26px;
}
.modal-title { font-size: 0.95rem; font-weight: 400; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.f-group { margin-bottom: 14px; }
.f-label { display: block; font-size: 0.8rem; color: var(--sub); margin-bottom: 5px; }
.f-input {
  width: 100%;
  padding: 7px 11px;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 0.86rem;
  font-family: inherit;
  color: var(--text);
  outline: none;
}
.f-input:focus { border-color: var(--accent); }
.f-input:disabled { background: #f5f5f5; color: #aaa; cursor: not-allowed; }
.f-sel {
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 2px;
  font-size: 0.84rem;
  font-family: inherit;
  color: var(--text);
  background: white;
  outline: none;
}
.f-sel:focus { border-color: var(--accent); }
.inst-edit-row { display: flex; gap: 6px; align-items: center; margin-bottom: 7px; flex-wrap: wrap; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); }

/* Empty */
.empty { text-align: center; padding: 80px 20px; color: var(--sub); font-size: 0.88rem; }

/* ===== ADMIN ACCORDION ===== */
.admin-row { cursor: pointer; }
.admin-row:hover { background: #faf9fb; }
.admin-expand-row { background: #fafafa; }
.admin-form { padding: 16px 20px 20px; text-align: left; }
.status-ok { color: var(--sub); font-size: 0.78rem; }
.status-ng { color: #bbb; font-size: 0.78rem; }
.admin-tog { color: var(--accent); font-size: 0.75rem; user-select: none; }
.header-search {
  padding: 0 10px; border: 1px solid var(--border);
  border-radius: 2px; font-size: 0.82rem; font-family: inherit;
  color: var(--text); outline: none; width: 140px; height: 28px;
}
.header-search:focus { border-color: var(--accent); }

/* ===== MODE BUTTONS ===== */
.mode-btn {
  padding: 0 14px;
  border: 1px solid var(--accent);
  background: white;
  color: var(--accent);
  font-size: 0.82rem;
  cursor: pointer !important;
  border-radius: 2px;
  font-family: inherit;
  transition: all 0.2s;
  height: 28px;
  line-height: 28px;
  white-space: nowrap;
}
.mode-btn:hover { background: var(--accent); color: white; }
.mode-btn.active { background: var(--accent); color: white; }
.mode-switch { font-size:1rem; cursor:pointer; transition:color 0.2s; }
.mode-switch:hover { color: var(--accent) !important; }

/* ===== PORTAL ===== */
.p-box {
  background: #f5f2f9;
  border-left: 3px solid var(--accent);
  padding: 13px 16px;
  margin: 12px 0;
  font-size: 0.86rem;
  line-height: 1.75;
}
.p-warn {
  background: #fdf4f4;
  border-left: 3px solid #c0392b;
  padding: 13px 16px;
  margin: 12px 0;
  font-size: 0.86rem;
  line-height: 1.75;
}
.p-white {
  background: white;
  border: 1px solid var(--border);
  padding: 13px 16px;
  margin: 12px 0;
  font-size: 0.86rem;
  line-height: 1.75;
}
.p-h2 {
  font-size: 0.88rem;
  font-weight: 500;
  color: white;
  background: var(--accent);
  padding: 7px 14px;
  margin: 36px 0 12px;
}
.p-h2:first-child { margin-top: 0; }
.p-h3 {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text);
  margin: 20px 0 8px;
}
.p-link {
  display: inline-block;
  color: var(--accent);
  font-size: 0.82rem;
  text-decoration: none;
  padding: 5px 12px;
  border: 1px solid var(--accent);
  border-radius: 2px;
  margin: 3px 3px 3px 0;
  transition: all 0.2s;
}
.p-link:hover { background: var(--accent); color: white; }
 .p-link-sm { display: inline-block; color: var(--accent); font-size: 0.82rem; text-decoration: none; padding: 1px 8px; border: 1px solid var(--accent); border-radius: 2px; margin: 0 3px; transition: all 0.2s; }
 .p-link-sm:hover { background: var(--accent); color: white; }
.p-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.84rem; white-space: normal; }
.p-table th { background: #f5f3f7; color: var(--accent-dark); padding: 8px 12px; text-align: left; font-weight: 500; border-bottom: 1px solid var(--border); }
.p-table td { padding: 8px 12px; border-bottom: 1px solid var(--border-light); vertical-align: top; text-align: left; }
.p-table tr:last-child td { border-bottom: none; }
.p-table tbody tr:hover td { background: #faf9fb; }
.p-acc-wrap { border: 1px solid var(--border); margin: 12px 0; overflow: hidden; }
.p-acc-header {
  padding: 11px 16px; cursor: pointer; display: flex;
  justify-content: space-between; align-items: center;
  font-size: 0.88rem; font-weight: 500; background: white; user-select: none;
}
.p-acc-header:hover { background: #faf9fb; }
.p-acc-body { display: none; padding: 14px 16px; border-top: 1px solid var(--border-light); }
.p-faq-item + .p-faq-item { border-top: 1px solid var(--border-light); }
.p-faq-q {
  padding: 11px 0;
  cursor: pointer;
  font-size: 0.86rem;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text);
  user-select: none;
  gap: 8px;
}
.p-faq-q:hover { color: var(--accent); }
.p-faq-toggle { color: var(--accent); font-size: 0.9rem; flex-shrink: 0; transition: transform 0.2s; }
.p-faq-a { display: none; padding: 8px 12px 12px 14px; font-size: 0.84rem; line-height: 1.8; color: var(--sub); border-left: 3px solid var(--border); margin-bottom: 4px; }
.p-faq-a.open { display: block; }
.p-template-wrap { border: 1px solid var(--border); margin: 12px 0; overflow: hidden; }
.p-template-header {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--accent); color: white; padding: 8px 14px; font-size: 0.83rem;
}
.p-copy-btn {
  background: white; color: var(--accent); border: none; padding: 4px 12px;
  border-radius: 10px; cursor: pointer; font-size: 0.78rem; font-family: inherit; transition: all 0.2s;
  min-width: 52px; text-align: center;
}
.p-copy-btn:hover { background: #f0eef4; }
.p-copy-btn.copied { background: #e8e8e8; color: var(--sub); }
.p-template-body { padding: 14px 16px; font-size: 0.84rem; line-height: 2; white-space: pre-wrap; background: #fafafa; color: var(--text); }
.update-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border-light); font-size: 0.84rem;
}
.update-item:last-child { border-bottom: none; }
.update-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; color: white; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
.update-date { color: var(--sub); font-size: 0.79rem; min-width: 76px; flex-shrink: 0; padding-top: 2px; }
.update-text { flex: 1; line-height: 1.6; }
.p-cat-title { font-size: 0.88rem; font-weight: 600; color: var(--accent-dark); background: #f0eef4; margin: 20px 0 8px; padding: 6px 10px; border-radius: 3px; }

/* ===== MOBILE ===== */
.hamburger { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 36px; height: 36px; cursor: pointer; padding: 6px; border: none; background: white; border-radius: 4px; flex-shrink: 0; }
.hamburger span { display: block; height: 3px; background: #A296AF; border-radius: 2px; width: 100%; }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 99; }
.sidebar-overlay.open { display: block; }

@media (max-width: 768px) {
  .hamburger { display: flex; }
  .sidebar {
    position: fixed;
    top: 56px;
    left: -220px;
    height: calc(100vh - 56px);
    z-index: 100;
    transition: left 0.25s ease;
    box-shadow: 2px 0 8px rgba(0,0,0,0.12);
  }
  .sidebar.open { left: 0; }
  .content { padding: 14px; }
  .header-right a.btn { display: none; }
  .card { padding: 14px; }
  .modal-box { width: 96vw !important; max-width: 96vw !important; max-height: 90vh; overflow-y: auto; }
  .hist-row { gap: 6px; flex-wrap: wrap; }
  .hist-date { min-width: 70px; font-size: 0.8rem; }
  .hist-links { margin-left: auto; }
  .app { height: 100svh; }
  body { overscroll-behavior: none; }
  #list2View .tbl-wrap table { min-width: 580px; width: auto; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="toast" id="toast"></div>
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <img src="/myportal/icon_key.png" alt="" class="login-icon">
    <div class="login-title">ペラトレ受講生管理</div>
    <input type="password" class="login-input" id="loginInput" placeholder="パスワード" autocomplete="off"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">ログイン</button>
    <div class="login-error" id="loginError">パスワードが違います</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <header class="header">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>
      <span id="btnStudents" class="mode-switch" onclick="switchMode('students')">受講生管理</span>
      <img src="本棚の無料アイコン%201.png" style="width:20px;height:20px;object-fit:contain;opacity:0.85;flex-shrink:0">
      <span id="btnPortal" class="mode-switch" onclick="switchMode('portal')">講師ポータル</span>
    </div>
    <div class="header-right">
      <a href="https://peratore-dashboard.vercel.app/teacher" target="_blank" class="btn btn-sm btn-primary">Pattern Practice ↗</a>
      <a href="/myportal/admin-VideoManagement00.html" target="_blank" class="btn btn-sm">Lesson Archive ↗</a>
      <button class="btn btn-sm" onclick="doLogout()">ログアウト</button>

  </header>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div id="sidebarBody"></div>
    </aside>

      <div class="empty" id="emptyMsg">← 受講生を選択してください</div>

      <div id="list2View" style="display:none"></div>
      <div id="instDashView" style="display:none"></div>

</div>

<!-- EDIT MODAL -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <div class="modal-title" id="editTitle">受講生を編集</div>
    <div id="editBody"></div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm" id="deleteBtn" onclick="doDelete()" style="margin-right:auto;display:none">削除</button>
      <button class="btn" onclick="closeEdit()">キャンセル</button>

<datalist id="dayList">
  <option value="月"><option value="火"><option value="水">
  <option value="木"><option value="金"><option value="土"><option value="日">
</datalist>

<script>
// パスワード照合・GAS呼び出しはサーバー（/api/legacy/*）で行う
const PORTAL_BASE = location.origin + '/myportal/myportal.html?key=';

let isAdmin = false;
let students = [];
let instructorList = [];
let staffData = {};
let gasData = [];
let currentId = null;
let currentInstructor = null;
let currentView = 'top';
let searchQ = '';
let editingId = null;
let listInstFilter = '';
let navList = [];
let instUpFilter = '';
let instHistFilter = '';
let sidebarState = { '受講生': false };

function hideAllViews() {
  ['emptyMsg','listView','list2View','instDashView','detailView','adminView','portalView'].forEach(id => hide(id));
  closeSidebar();
}

// ===== AUTH =====
async function doLogin() {
  const v = document.getElementById('loginInput').value.trim();
  let ok = false;
  try {
    const r = await fetch('/api/legacy/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: v }) });
    ok = r.ok;
  } catch(e) {}
  if (ok) {
    isAdmin = true;
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    init();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

function doLogout() {
  isAdmin = false; currentId = null; currentInstructor = null; currentView = 'top'; searchQ = '';
  fetch('/api/legacy/logout', { method: 'POST' }).catch(() => {});
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginInput').value = '';
  document.getElementById('loginError').style.display = 'none';
}

// ===== INIT =====
async function init() {
  await Promise.all([loadStudents(), loadStaff(), loadUpdates()]);
  showList();
  loadGAS();
  switchMode('students');
}

// 自動ログイン
fetch('/api/legacy/session').then(r => r.json()).then(j => {
  if (!j.ok) return;
  isAdmin = true;
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  init();
}).catch(() => {});

async function loadStudents() {
  try {
    const r = await fetch('/api/legacy/store/students?t=' + Date.now());
    const d = await r.json();
    students = (d.students || []).sort((a,b) => a.id - b.id);
    instructorList = d.instructors || [];
  } catch(e) { console.error('students load error', e); }
}

async function loadStaff() {
  try {
    const r = await fetch('/api/legacy/store/staff?t=' + Date.now());
    staffData = await r.json();
  } catch(e) { staffData = {}; }
}

async function loadGAS() {
  try {
    const cached = sessionStorage.getItem('gas_cache');
    if (cached) {
      gasData = JSON.parse(cached);
    } else {
      const r = await fetch('/api/legacy/gas');
      gasData = await r.json();
      if (Array.isArray(gasData)) sessionStorage.setItem('gas_cache', JSON.stringify(gasData));
    }
    if (currentId) renderUpcoming(currentId);
  } catch(e) { console.error('GAS error', e); }
}

// ===== SIDEBAR =====
function renderSidebar() {
  const q = searchQ.toLowerCase();
  const filtered = q ? students.filter(s => s.name.includes(q) || String(s.id).includes(q)) : students;

  // instructor map
  const instMap = {};
  students.forEach(s => {
    const sd = staffData[String(s.id)];
    if (sd && sd.instructors) {
      sd.instructors.forEach(i => {
        if (!instMap[i.name]) instMap[i.name] = [];
        instMap[i.name].push(s);
      });
    }
  });

  const activeFiltered = filtered.filter(s => s.status !== 'retired');
  const retiredFiltered = filtered.filter(s => s.status === 'retired');

  const sec = (key, def) => sidebarState[key] !== undefined ? sidebarState[key] : def;
  let html = '';

  // 一覧リンク
  html += `<div class="s-section">
    <div style="padding:6px 8px 2px"><div class="s-dash-btn ${currentView==='list'?'active':''}" style="margin:0;display:block;text-align:center" onclick="showList()">全受講生一覧１</div></div>
    <div style="padding:2px 8px 8px"><div class="s-dash-btn ${currentView==='list2'?'active':''}" style="margin:0;display:block;text-align:center" onclick="showList2()">全受講生一覧２</div></div>
  </div>`;

  // 受講生（state保持）
  const stuOpen = sec('受講生', true);
  html += `<div class="s-section">
    <div class="s-header" onclick="toggleSec(this)" data-key="受講生">
      <span class="s-arrow">${stuOpen?'▼':'▶'}</span><span>受講生</span>
      <span class="s-count">${activeFiltered.length}名</span>
    </div>
    <div class="s-body ${stuOpen?'open':''}">
      ${activeFiltered.map(s => `<div class="s-item ${currentId===s.id?'active':''}" onclick="showDetail(${s.id})">${h(s.name)}</div>`).join('')}
    </div>
  </div>`;

  // 講師別（担当一覧リンク付き・state保持）
  const sortedInstEntries = Object.entries(instMap).sort(([a], [b]) => {
    const ai = instructorList.indexOf(a);
    const bi = instructorList.indexOf(b);
    if (ai === -1 && bi === -1) return 0;
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });
  sortedInstEntries.forEach(([name, list]) => {
    const fl = q ? list.filter(s => s.name.includes(q) && s.status !== 'retired') : list.filter(s => s.status !== 'retired');
    if (fl.length === 0) return;
    const isOpen = sec('inst_'+name, false);
    html += `<div class="s-section">
      <div class="s-header" data-key="inst_${h(name)}">
        <span class="s-arrow" onclick="event.stopPropagation();openInstAndDash('${h(name)}')">${isOpen?'▼':'▶'}</span>
        <span style="flex:1;cursor:pointer;color:${currentView==='instDash'&&currentInstructor===name?'var(--accent)':'inherit'};font-weight:${currentView==='instDash'&&currentInstructor===name?'500':'400'}" onclick="openInstAndDash('${h(name)}')">${h(name)}</span>
        <span class="s-count">${fl.length}名</span>
      </div>
      <div class="s-body ${isOpen?'open':''}">
        ${fl.sort((a,b)=>a.id-b.id).map(s => `<div class="s-item ${currentId===s.id?'active':''}" onclick="showDetail(${s.id})">${h(s.name)}</div>`).join('')}
      </div>
    </div>`;
  });

  // 退会者（state保持）
  if (retiredFiltered.length > 0) {
    const retOpen = sec('退会者', false);
    html += `<div class="s-section">
      <div class="s-header" onclick="toggleSec(this)" data-key="退会者">
        <span class="s-arrow">${retOpen?'▼':'▶'}</span><span>退会者</span>
        <span class="s-count">${retiredFiltered.length}名</span>
      </div>
      <div class="s-body ${retOpen?'open':''}">
        ${retiredFiltered.map(s => `<div class="s-item ${currentId===s.id?'active':''}" onclick="showDetail(${s.id})">${h(s.name)}</div>`).join('')}
      </div>
    </div>`;
  }

  document.getElementById('sidebarBody').innerHTML = html;
}

function toggleSec(el) {
  const body = el.nextElementSibling;
  const arrow = el.querySelector('.s-arrow');
  body.classList.toggle('open');
  const isOpen = body.classList.contains('open');
  arrow.textContent = isOpen ? '▼' : '▶';
  const key = el.dataset.key;
  if (key) sidebarState[key] = isOpen;
}

function openInstAndDash(name) {
  if (currentView === 'instDash' && currentInstructor === name) {
    sidebarState['inst_'+name] = false;
    showList();
    return;
  }
  sidebarState['inst_'+name] = true;
  showInstDash(name);
}

function formatTime(val) {
  const v = val.replace(/[^0-9]/g, '');
  if (v.length === 3) return v[0] + ':' + v.slice(1);
  if (v.length === 4) return v.slice(0,2) + ':' + v.slice(2);
  return val;
}

function onSearch(v) {
  searchQ = v;
  renderSidebar();
  if (currentView === 'list') renderList();
  else if (currentView === 'list2') renderList2();
}

// ===== TOP =====
function showTop() {
  currentId = null; currentInstructor = null; currentView = 'top';
  hideAllViews(); show('emptyMsg');
  renderSidebar();
}

// ===== LIST VIEW =====
function showList() {
  currentId = null; currentInstructor = null; currentView = 'list';
  hideAllViews(); show('listView');
  listInstFilter = '';
  renderList();
  renderSidebar();
}

function showList2() {
  currentId = null; currentInstructor = null; currentView = 'list2';
  hideAllViews(); show('list2View');
  renderList2();
  renderSidebar();
}

function makeInstNameCell(insts) {
  if (!insts.length) return '<span style="color:#ccc">未登録</span>';
  return insts.map(i => `<div style="font-size:0.85rem">${h(i.name)}</div>`).join('');
}
function makeInstDayCell(insts) {
  if (!insts.length) return '<span style="color:#ccc">─</span>';
  return insts.map(i => {
    if (i.type === '都度') return `<div style="font-size:0.78rem;color:var(--sub)">都度</div>`;
    return `<div style="font-size:0.78rem;color:var(--sub)">${h(i.day||'')} ${h(i.time||'')}</div>`;
  }).join('');
}
function makeInstFreqCell(insts) {
  if (!insts.length) return '<span style="color:#ccc">─</span>';
  return insts.map(i => `<div style="font-size:0.78rem;color:var(--sub)">${i.freq||'月4'}</div>`).join('');
}

function renderList() {
  const allInst = new Set();
  students.forEach(s => {
    const sd = staffData[String(s.id)];
    if (sd && sd.instructors) sd.instructors.forEach(i => allInst.add(i.name));
  });

  const makeRow = s => {
    const sd = staffData[String(s.id)] || {};
    const portal = PORTAL_BASE + s.accessKey;
    return `<tr style="cursor:pointer" onclick="showDetail(${s.id})">
      <td style="color:var(--sub)">${s.id}</td>
      <td>${h(s.name)}</td>
      <td style="vertical-align:middle">${makeInstNameCell(sd.instructors||[])}</td>
      <td style="vertical-align:middle">${makeInstDayCell(sd.instructors||[])}</td>
      <td>${s.freq || '月4'}</td>
      <td>${sd.level||'－'}</td>
      <td>${s.lineUrl?`<a href="${h(s.lineUrl)}" target="_blank" class="btn btn-sm btn-primary" onclick="event.stopPropagation()">LINE ↗</a>`:'－'}</td>
      <td>${sd.folderUrl?`<a href="${h(sd.folderUrl)}" target="_blank" class="btn btn-sm" onclick="event.stopPropagation()">Drive ↗</a>`:'－'}</td>
      <td>${sd.hearingUrl?`<a href="${h(sd.hearingUrl)}" target="_blank" class="btn btn-sm" onclick="event.stopPropagation()">Sheet ↗</a>`:'－'}</td>
      <td><a href="${h(portal)}" target="_blank" class="btn btn-sm" onclick="event.stopPropagation()">portal ↗</a></td>
      <td>${s.ppUrl?`<a href="${h(s.ppUrl)}" target="_blank" class="btn btn-sm" onclick="event.stopPropagation()">PP ↗</a>`:'－'}</td>
    </tr>`;
  };

  const q = searchQ.toLowerCase();
  let filtered = students.filter(s => {
    if (s.status === 'retired') return false;
    if (q && !s.name.includes(q)) return false;
    if (!listInstFilter) return true;
    const sd = staffData[String(s.id)];
    return sd && sd.instructors && sd.instructors.some(i => i.name === listInstFilter);
  });
  let retiredFiltered = students.filter(s => {
    if (s.status !== 'retired') return false;
    if (q && !s.name.includes(q)) return false;
    if (!listInstFilter) return true;
    const sd = staffData[String(s.id)];
    return sd && sd.instructors && sd.instructors.some(i => i.name === listInstFilter);
  });

  const retiredAccordion = retiredFiltered.length ? `
    <div style="margin-top:16px;border-top:2px solid var(--border-light)">
      <div style="padding:10px 4px;font-size:0.82rem;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:6px"
        onclick="const b=this.nextElementSibling;const open=b.style.display==='none';b.style.display=open?'block':'none';this.querySelector('.ret-arrow').textContent=open?'▼':'▶'">
        <span class="ret-arrow">▶</span>退会者（${retiredFiltered.length}名）
      </div>
      <div style="display:none">
        <div class="tbl-wrap"><table>
          <thead><tr><th>#</th><th>氏名</th><th>担当講師</th><th>日時</th><th>頻度</th><th>レベル</th><th>LINE</th><th>フォルダ</th><th>ヒアリング</th><th>portal</th><th>PP</th></tr></thead>
          <tbody>${retiredFiltered.map(makeRow).join('')}</tbody>
        </table></div>
      </div>
    </div>` : '';

  const html = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div style="font-size:0.82rem;color:var(--sub)">${filtered.length}名</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:0.8rem;color:var(--sub)">講師：</span>
        <select class="filter-sel" onchange="listInstFilter=this.value;renderList()">
          <option value="">全員</option>
          ${Array.from(allInst).map(n=>`<option value="${h(n)}"${listInstFilter===n?' selected':''}>${h(n)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>氏名</th><th>担当講師</th><th>日時</th><th>頻度</th><th>レベル</th><th>LINE</th>
          <th>フォルダ</th><th>ヒアリング</th><th>portal</th><th>PP</th>
        </tr></thead>
        <tbody>${filtered.map(makeRow).join('')}</tbody>
      </table>
    </div>
    ${retiredAccordion}`;

  document.getElementById('listView').innerHTML = html;
}

// ===== INST DASH =====
function showInstDash(name) {
  currentId = null; currentInstructor = name; currentView = 'instDash';
  instUpFilter = ''; instHistFilter = '';
  hideAllViews(); show('instDashView');
  renderInstDash(name);
  renderSidebar();
}

// ===== LIST2 VIEW =====
function renderList2() {
  const q = searchQ.toLowerCase();
  const makeRow2 = s => {
    const sd = staffData[String(s.id)] || {};
    return `<tr style="cursor:pointer" onclick="showDetail(${s.id})">
      <td>${s.id}</td>
      <td class="td-left">${h(s.name)}</td>
      <td>${makeInstNameCell(sd.instructors||[])}</td>
      <td class="note-cell" style="cursor:pointer" onclick="event.stopPropagation();startCellEdit(${s.id},'noteLecturer',this)">${sd.noteLecturer?h(sd.noteLecturer):'<span style="color:#ccc">─</span>'}</td>
      <td class="note-cell" style="cursor:pointer" onclick="event.stopPropagation();startCellEdit(${s.id},'noteAdmin',this)">${sd.noteAdmin?h(sd.noteAdmin):'<span style="color:#ccc">─</span>'}</td>
    </tr>`;
  };
  const active = students.filter(s => s.status!=='retired' && (!q||s.name.includes(q)));
  const retired = students.filter(s => s.status==='retired' && (!q||s.name.includes(q)));
  const retiredAccordion = retired.length ? `
    <div style="margin-top:16px;border-top:2px solid var(--border-light)">
      <div style="padding:10px 4px;font-size:0.82rem;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:6px"
        onclick="const b=this.nextElementSibling;const open=b.style.display==='none';b.style.display=open?'block':'none';this.querySelector('.ret-arrow').textContent=open?'▼':'▶'">
        <span class="ret-arrow">▶</span>退会者（${retired.length}名）
      </div>
      <div style="display:none">
        <div class="tbl-wrap"><table style="table-layout:fixed;width:100%">
          <colgroup>
            <col style="width:40px"><col style="width:100px"><col style="width:90px"><col><col>
          </colgroup>
          <thead><tr>
            <th>#</th><th>氏名</th><th>担当講師</th>
            <th>備考（講師）</th><th>備考（運営）</th>
          </tr></thead>
          <tbody>${retired.map(makeRow2).join('')}</tbody>
        </table></div>
      </div>
    </div>` : '';
  document.getElementById('list2View').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="font-size:0.82rem;color:var(--sub)">${active.length}名</div>
      <button class="s-dash-btn" style="margin:0" onclick="showAdmin()">管理</button>
    </div>
    <div class="tbl-wrap"><table style="table-layout:fixed;width:100%">
      <colgroup>
        <col style="width:40px"><col style="width:100px"><col style="width:90px"><col><col>
      </colgroup>
      <thead><tr>
        <th>#</th><th>氏名</th><th>担当講師</th>
        <th>備考（講師）</th><th>備考（運営）</th>
      </tr></thead>
      <tbody>${active.map(makeRow2).join('')}</tbody>
    </table></div>
    ${retiredAccordion}`;
}

// ===== INST DASH VIEW =====
function renderInstDash(name) {
  const parseRaw = raw => { if(!raw) return null; const p=raw.split('.').map(Number); return new Date(p[0],p[1]-1,p[2]); };
  const today = new Date(); today.setHours(0,0,0,0);
  const d60 = new Date(); d60.setDate(d60.getDate()+60);
  const days = ['日','月','火','水','木','金','土'];
  const getInstName = item => { if(item.title){const p=item.title.split(/[／\/]/);const l=p[p.length-1].trim();if(l)return l;} return item.instructor||item.instructorName||''; };
  const fmtDate = item => { const d=parseRaw(item.rawDate); if(!d)return item.rawDate||''; const t=item.date?(item.date.match(/(\d{1,2}:\d{2})/)||[])[1]||'':''; return `${d.getMonth()+1}月${d.getDate()}日(${days[d.getDay()]})${t?' '+t:''}`; };

  const myStudents = students.filter(s => {
    if (s.status==='retired') return false;
    const sd = staffData[String(s.id)];
    return sd && sd.instructors && sd.instructors.some(i=>i.name===name);
  });

  const allUp = Array.isArray(gasData) ? gasData.filter(item => {
    const d = parseRaw(item.rawDate);
    return d && d>=today && d<=d60 && getInstName(item)===name;
  }).sort((a,b)=>parseRaw(a.rawDate)-parseRaw(b.rawDate)) : [];

  const getStudentName = id => { const s=students.find(s=>String(s.id)===String(id)); return s?s.name:''; };

  const allHist = [];
  myStudents.forEach(s => {
    (s.lessons||[]).forEach(l => { if(l.instructor===name) allHist.push({...l,studentName:s.name}); });
  });
  allHist.sort((a,b) => { const da=new Date((a.date||'').replace(/\./g,'/')), db=new Date((b.date||'').replace(/\./g,'/')); return db-da; });

  const filtUp = instUpFilter ? allUp.filter(i=>getStudentName(i.studentId)===instUpFilter) : allUp;
  const filtHist = instHistFilter ? allHist.filter(l=>l.studentName===instHistFilter) : allHist;

  const stuOpts = (cur, varName) => `<select class="filter-sel" onchange="${varName}=this.value;renderInstDash('${h(name)}')">
    <option value="">全員</option>
    ${myStudents.map(s=>`<option value="${h(s.name)}"${cur===s.name?' selected':''}>${h(s.name)}</option>`).join('')}
  </select>`;

  const N = 5;
  const upRows = list => list.length
    ? list.map(item=>`<div class="lesson-row"><span class="lesson-date">${fmtDate(item)}</span><span class="lesson-inst">${h(getStudentName(item.studentId))}</span></div>`).join('')
    : '<div style="color:#ccc;font-size:0.88rem;padding:6px 0">予定なし</div>';

  const histRows = list => list.length
    ? list.map(l=>`<div class="hist-row">
        <span class="hist-num${l.cancelled?' cancelled':''}">Lesson ${l.lessonNumber}</span>
        <span class="hist-date">${h(l.date||'')}</span>
        <div style="flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0">
          <span class="hist-inst" style="flex:none">${h(l.studentName)}</span>
          ${l.cancelled?`<span class="hist-tag hist-tag-cancel">お休み</span>`:''}
          ${l.note?`<span class="hist-tag hist-tag-note">${h(l.note)}</span>`:''}
        </div>
        <div class="hist-links">
          ${l.videoUrl?`<a href="${h(l.videoUrl)}" target="_blank" class="btn btn-sm">動画↗</a>`:''}

function buildNavList() {
  const q = searchQ.toLowerCase();
  if (currentView === 'instDash' && currentInstructor) {
    return students.filter(s => {
      if (s.status === 'retired') return false;
      const sd = staffData[String(s.id)];
      return sd && sd.instructors && sd.instructors.some(i => i.name === currentInstructor);
    }).sort((a,b) => a.id - b.id).map(s => s.id);
  }
  return students.filter(s => {
    if (s.status === 'retired') return false;
    if (q && !s.name.includes(q)) return false;
    if (listInstFilter) {
      const sd = staffData[String(s.id)];
      if (!sd || !sd.instructors || !sd.instructors.some(i => i.name === listInstFilter)) return false;
    }
    return true;
  }).map(s => s.id);
}

function renderHistory(s) {
  const lessons = (s.lessons||[]).slice().reverse();
  if (!lessons.length) return '<div style="color:#ccc;font-size:0.82rem">なし</div>';
  const N = 3;
  const rows = items => items.map(l => `
    <div class="hist-row">
      <span class="hist-num${l.cancelled?' cancelled':''}">Lesson ${l.lessonNumber}</span>
      <span class="hist-date">${h(l.date||'')}</span>
      <div style="flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0">
        <span class="hist-inst" style="flex:none">${h(l.instructor||'')}</span>
        ${l.cancelled ? `<span class="hist-tag hist-tag-cancel">お休み</span>` : ''}
        ${l.note ? `<span class="hist-tag hist-tag-note">${h(l.note)}</span>` : ''}
      </div>
      <div class="hist-links">
        ${l.videoUrl?`<a href="${h(l.videoUrl)}" target="_blank" class="btn btn-sm">動画↗</a>`:''}
        ${l.memoUrl?`<a href="${h(l.memoUrl)}" target="_blank" class="btn btn-sm">メモ↗</a>`:''}
      </div>
    </div>`).join('');

  if (lessons.length <= N) return rows(lessons);
  return `${rows(lessons.slice(0,N))}
    <div id="histMore" style="display:none">${rows(lessons.slice(N))}</div>
    <button class="show-more" id="histBtn" onclick="toggleHist()">▼ もっと見る（${lessons.length-N}件）</button>`;
}

function toggleHist() {
  const m = document.getElementById('histMore');
  const b = document.getElementById('histBtn');
  const open = m.style.display === 'none';
  m.style.display = open ? 'block' : 'none';
  b.textContent = open ? '▲ 閉じる' : `▼ もっと見る（${m.querySelectorAll('.hist-row').length}件）`;
}

// ===== UPCOMING =====
function renderUpcoming(id) {
  const el = document.getElementById('upcomingWrap');
  if (!el) return;

  const parseRaw = raw => {
    if (!raw) return null;
    const p = raw.split('.').map(Number);
    return new Date(p[0], p[1]-1, p[2]);
  };

  const today = new Date(); today.setHours(0,0,0,0);
  const d60 = new Date(); d60.setDate(d60.getDate()+60);
  const days = ['日','月','火','水','木','金','土'];

  const upcoming = Array.isArray(gasData) ? gasData.filter(item => {
    const d = parseRaw(item.rawDate);
    return d && String(item.studentId)===String(id) && d>=today && d<=d60;
  }).sort((a,b) => parseRaw(a.rawDate)-parseRaw(b.rawDate)) : [];

  const fmtDate = item => {
    const d = parseRaw(item.rawDate);
    if (!d) return item.rawDate||'';
    const t = item.date ? (item.date.match(/(\d{1,2}:\d{2})/)||[])[1]||'' : '';
    return `${d.getMonth()+1}月${d.getDate()}日(${days[d.getDay()]})${t?' '+t:''}`;
  };

  const getInstName = item => {
    if (item.title) {
      const parts = item.title.split(/[／\/]/);
      const last = parts[parts.length - 1].trim();
      if (last) return last;
    }
    return item.instructor || item.instructorName || '';
  };

  const N = 3;
  const rowsHtml = list => {
    if (!list.length) return '<div style="color:#ccc;font-size:0.88rem;padding:6px 0">予定なし</div>';
    return list.map(item => `
      <div class="lesson-row">
        <span class="lesson-date">${fmtDate(item)}</span>
        <span class="lesson-inst">${h(getInstName(item))}</span>
      </div>`).join('');
  };

  let content;
  if (upcoming.length <= N) {
    content = rowsHtml(upcoming);
  } else {
    content = `${rowsHtml(upcoming.slice(0,N))}
      <div id="upMore" style="display:none">${rowsHtml(upcoming.slice(N))}</div>
      <button class="show-more" id="upBtn" onclick="toggleUp()">▼ もっと見る（${upcoming.length-N}件）</button>`;
  }

  el.innerHTML = content;
}

function toggleUp() {
  const m = document.getElementById('upMore');
  const b = document.getElementById('upBtn');
  const open = m.style.display==='none';
  m.style.display = open ? 'block' : 'none';
  b.textContent = open ? '▲ 閉じる' : `▼ もっと見る（${m.querySelectorAll('.lesson-row').length}件）`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function saveDetailInline(id) {
  const instructors = [];
  document.getElementById('detailInstRows').querySelectorAll('.inst-edit-row').forEach(row => {
    const sels = row.querySelectorAll('select');
    const n = sels[0].value;
    if (!n) return;
    const type = sels[1].value;
    const dayInput = row.querySelector('input[list="dayList"]');
    const day = dayInput ? dayInput.value.trim() : '';
    const timeInput = row.querySelector('input[placeholder="20:00"]');
    const time = timeInput ? timeInput.value.trim() : '';
    instructors.push({name:n, type, day, time});
  });
  const folderUrl = document.getElementById('detailFolderUrl').value.trim();
  const hearingUrl = document.getElementById('detailHearingUrl').value.trim();
  if (!staffData[String(id)]) staffData[String(id)] = {};
  Object.assign(staffData[String(id)], {instructors, folderUrl, hearingUrl});
  await saveStaff();
  showToast('保存しました ✓');
  showDetail(id);
}

    const type = sels[1].value;
    const dayInput = row.querySelector('input[list="dayList"]');
    const day = dayInput ? dayInput.value.trim() : '';
    const timeInput = row.querySelector('input[placeholder="20:00"]');
    const time = timeInput ? timeInput.value.trim() : '';
    instructors.push({name:n, type, day, time});
  });

  if (editingId) {
    if (!staffData[String(editingId)]) staffData[String(editingId)] = {};
    Object.assign(staffData[String(editingId)], {instructors, folderUrl, hearingUrl});
  } else {
    // add not supported (students come from myportal)
    alert('受講生の追加はマイポータルで行ってください');
    return;
  }

  const savedId = editingId;
  await saveStaff();
  closeEdit();
  renderSidebar();
  if (savedId) { showDetail(savedId); } else { showList(); }
}

async function doDelete() {
  if (!editingId) return;
  const s = students.find(s=>s.id===editingId);
  if (!s || !confirm(`「${s.name}」を削除しますか？`)) return;
  students = students.filter(s=>s.id!==editingId);
  delete staffData[String(editingId)];
  await saveStaff();
  closeEdit();
  currentId = null;
  renderSidebar();
  showList();
}

async function saveStaff() {
  try {
    await fetch('/api/legacy/store/staff', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(staffData)
    });
  } catch(e) { console.error('save error', e); }
}

function toggleAdminRow(id) {
  if (adminExpanded.has(id)) adminExpanded.delete(id);

}

async function saveAdminRow(id) {
  const instructors = [];
  document.getElementById(`adminInstRows${id}`).querySelectorAll('.inst-edit-row').forEach(row => {
    const sels = row.querySelectorAll('select');
    const n = sels[0].value; if (!n) return;
    const type = sels[1].value;
    const dayInput = row.querySelector('input[list="dayList"]');
    const day = dayInput ? dayInput.value.trim() : '';
    const timeInput = row.querySelector('input[placeholder="20:00"]');
    const time = timeInput ? timeInput.value.trim() : '';
    instructors.push({name:n, type, day, time});
  });
  const folderUrl = document.getElementById(`adminFolder${id}`).value.trim();
  const hearingUrl = document.getElementById(`adminHearing${id}`).value.trim();
  const noteAdmin = document.getElementById(`adminNote${id}`).value.trim();
  const level = document.getElementById(`adminLevel${id}`).value;
  if (!staffData[String(id)]) staffData[String(id)] = {};
  Object.assign(staffData[String(id)], {instructors, folderUrl, hearingUrl, noteAdmin, level});
  await saveStaff();
  showToast('保存しました ✓');

function h(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function show(id) { document.getElementById(id).style.display = 'block'; }
function hide(id) { document.getElementById(id).style.display = 'none'; }

function initPortalPage(page) {
  // FAQ accordion
  document.querySelectorAll('.p-faq-q').forEach(q => {
    q.onclick = function() {
      const a = this.nextElementSibling;
      const t = this.querySelector('.p-faq-toggle');
      const open = a.classList.toggle('open');
      if (t) t.textContent = open ? '▲' : '▼';
    };
  });
  // White box accordion
  document.querySelectorAll('.p-acc-header').forEach(h => {
    h.onclick = function() {
      const body = this.nextElementSibling;
      const t = this.querySelector('.p-faq-toggle');
      const open = body.style.display === 'none';
      body.style.display = open ? 'block' : 'none';
      if (t) t.textContent = open ? '▲' : '▼';
    };
  });
  // Copy buttons
  document.querySelectorAll('.p-copy-btn').forEach(btn => {
    btn.onclick = function() {
      const text = this.closest('.p-template-wrap').querySelector('.p-template-body').textContent;
      navigator.clipboard.writeText(text.trim()).then(() => {
        const orig = this.textContent;
        this.textContent = 'OK';
        this.classList.add('copied');
        setTimeout(() => { this.textContent = orig; this.classList.remove('copied'); }, 2000);
      });
    };
  });
}

        { q: '受講生が遅刻・欠席した場合は？', a: 'レッスン開始時に受講生が参加していない場合は、すぐに受講生へLINEで連絡し、運営にも報告。<br>その後はレッスン時間中待機し、途中から参加した場合は残り時間でレッスンを実施してください。' },
        { q: '録画は自分でボタンを押す必要がありますか？', a: '共有アカウント（運営ペラトレ）でGoogle Meetに入ると自動で録画されます。レッスン開始時に録画されていることを必ず確認し、録画されていない場合は手動で録画ボタンを押下してください。' },
        { q: 'LINE Official AccountにiPhoneからログインするとペラトレアカウントが表示されない', a: 'PCからアクセスすると表示されます。' },
        { q: 'TimeRexとSlackの連携はどうやってすればいい？', a: 'Googleカレンダー内での連携と、#ペラトレ-予約チャンネルへの連携の両方が必要です。どちらか一方だけでは連携が完了しません。' },
        { q: '共有アカウントにログインしようとすると本人確認が表示される', a: 'ログイン前にSlackで運営にご連絡ください。本人確認が必要なため、事前連絡なしではログインを承認できない場合があります。' },
      ]
    },
    {
      cat: '報酬について',
      items: [
        { q: '勉強会に参加した場合も報酬がありますか？', a: '運営から「依頼」している場合のみ対象です。自主参加は対象外です。' },
        { q: '給与の支払日はいつですか？', a: '毎月25日に前月分をお支払いします。毎月5日の締切を過ぎると、その月の25日には報酬が支払われませんのでご注意ください。' },
      ]
    },
    {
      cat: 'その他',
      items: [
        { q: '不明点はどこに相談すればいいですか？', a: '運営Slack窓口（#英会話講師-業務連絡用）にいつでも相談してください。' },
        { q: '自己紹介動画はどう撮ればいい？', a: '明るい場所で撮影してください。他の講師の自己紹介動画も参考にしてみてください。' },
        { q: 'Google Meetのレッスン画面を明るくしたい', a: '画面右上の3点メニュー →「背景とエフェクト」→「スタイル」から明るさを調整できます。' },
      ]
    }
  ];
  const html = faqData.map(cat => `
    <div class="p-cat-title">${h(cat.cat)}</div>
    <div>${cat.items.map(item => `
      <div class="p-faq-item">
        <div class="p-faq-q">${item.q}<span class="p-faq-toggle">▼</span></div>
        <div class="p-faq-a">${item.a}</div>
      </div>`).join('')}
    </div>`).join('');

  return `<div class="card"><div class="p-h2" style="margin-top:0">よくある質問（FAQ）</div>${html}</div>`;
}
</script>

</html>
