<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バッジ管理 - ペラトレ講師ポータル</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background: #F8F9FA;
            min-height: 100vh;
            color: #333;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 24px 32px;
            border-radius: 12px;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .nav-links {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
        }

        .nav-link {
            padding: 10px 20px;
            background: #fff;
            border-radius: 8px;
            text-decoration: none;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid #E5E7EB;
        }

        .nav-link:hover {
            background: #F9FAFB;
        }

        .add-section {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .add-section h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1F2937;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-help {
            font-size: 13px;
            color: #6B7280;
            margin-top: 4px;
        }

        .color-presets {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        .color-preset {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            color: #fff;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .color-preset:hover {
            transform: scale(1.05);
            border-color: #1F2937;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #E5E7EB;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #D1D5DB;
        }

        .btn-danger {
            background: #EF4444;
            color: #fff;
        }

        .btn-danger:hover {
            background: #DC2626;
        }

        .btn-edit {
            background: #3B82F6;
            color: #fff;
        }

        .btn-edit:hover {
            background: #2563EB;
        }

        .badges-list {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .badges-list h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1F2937;
        }

        .badge-item {
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s;
        }

        .badge-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .badge-preview {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .badge-info {
            flex: 1;
        }

        .badge-id {
            font-size: 13px;
            color: #6B7280;
            font-family: 'Courier New', monospace;
        }

        .badge-label {
            font-size: 15px;
            font-weight: 600;
            color: #1F2937;
            margin-top: 4px;
        }

        .badge-actions {
            display: flex;
            gap: 8px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .message-success {
            background: #D1FAE5;
            color: #065F46;
            border: 1px solid #6EE7B7;
        }

        .message-error {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9CA3AF;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 16px;
            }

            .header {
                padding: 20px 24px;
            }

            .add-section,
            .badges-list {
                padding: 20px;
            }

            .badge-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .badge-actions {
                width: 100%;
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 バッジ管理</h1>
            <p>更新履歴で使用するバッジを管理します</p>
        </div>

        <div class="nav-links">
            <a href="updates-admin.html" class="nav-link">← 更新履歴管理に戻る</a>
        </div>

        <div id="message"></div>

        <div class="add-section">
            <h2 id="formTitle">新規追加</h2>
            <form id="badgeForm">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label for="badgeId">ID *</label>
                    <input type="text" id="badgeId" placeholder="例: notice" required>
                    <div class="form-help">半角英数字のみ。一度設定したら変更しないでください。</div>
                </div>

                <div class="form-group">
                    <label for="badgeLabel">表示テキスト *</label>
                    <input type="text" id="badgeLabel" placeholder="例: お知らせ" required>
                </div>

                <div class="form-group">
                    <label for="badgeColor">色・グラデーション *</label>
                    <input type="text" id="badgeColor" placeholder="例: #3B82F6 または linear-gradient(...)" required>
                    <div class="form-help">CSSの色指定（カラーコード、グラデーションなど）</div>
                    
                    <div class="color-presets" id="colorPresets">
                        <!-- JavaScriptで動的生成 -->
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">追加する</button>
                <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">キャンセル</button>
            </form>
        </div>

        <div class="badges-list">
            <h2>バッジ一覧</h2>
            <div id="badgesList"></div>
        </div>
    </div>

    <script>
        let badges = [];
        let editingId = null;

        // カラープリセット
        const colorPresets = [
            { name: '紫グラデ', value: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)' },
            { name: '青グラデ', value: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)' },
            { name: 'ピンクグラデ', value: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)' },
            { name: '緑グラデ', value: 'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)' },
            { name: 'オレンジグラデ', value: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)' },
            { name: '青単色', value: '#3B82F6' },
            { name: '赤単色', value: '#EF4444' },
            { name: '緑単色', value: '#10B981' },
            { name: '黄単色', value: '#F59E0B' },
            { name: '紫単色', value: '#8B5CF6' }
        ];

        // 初期読み込み
        loadBadges();
        renderColorPresets();

        // フォーム送信
        document.getElementById('badgeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            saveBadge();
        });

        // キャンセルボタン
        document.getElementById('cancelBtn').addEventListener('click', function() {
            cancelEdit();
        });

        // カラープリセット表示
        function renderColorPresets() {
            const presetsEl = document.getElementById('colorPresets');
            presetsEl.innerHTML = colorPresets.map(preset => `
                <div class="color-preset" style="background: ${preset.value}" onclick="selectColor('${preset.value.replace(/'/g, "\\'")}')">
                    ${preset.name}
                </div>
            `).join('');
        }

        // カラー選択
        function selectColor(color) {
            document.getElementById('badgeColor').value = color;
        }

        // データ読み込み
        async function loadBadges() {
            try {
                const response = await fetch('/api/tutor/badges?action=get');
                const data = await response.json();
                
                if (data.success) {
                    badges = data.data || [];
                    renderBadges();
                } else {
                    showMessage('データの読み込みに失敗しました', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('データの読み込み中にエラーが発生しました', 'error');
            }
        }

        // バッジを保存
        async function saveBadge() {
            const id = document.getElementById('badgeId').value.trim();
            const label = document.getElementById('badgeLabel').value.trim();
            const color = document.getElementById('badgeColor').value.trim();

            if (!id || !label || !color) {
                showMessage('すべての項目を入力してください', 'error');
                return;
            }

            // IDの重複チェック（新規追加時のみ）
            if (!editingId && badges.some(b => b.id === id)) {
                showMessage('このIDは既に使用されています', 'error');
                return;
            }

            const newBadge = {
                id: id,
                label: label,
                color: color
            };

            if (editingId) {
                // 編集
                const index = badges.findIndex(b => b.id === editingId);
                if (index !== -1) {
                    // IDは変更させない
                    newBadge.id = editingId;
                    badges[index] = newBadge;
                }
            } else {
                // 新規追加
                badges.push(newBadge);
            }

            // サーバーに保存
            try {
                const response = await fetch('/api/tutor/badges', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ action: 'save', data: badges })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage(editingId ? '更新しました' : '追加しました', 'success');
                    resetForm();
                    renderBadges();
                } else {
                    showMessage('保存に失敗しました', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('保存中にエラーが発生しました', 'error');
            }
        }

        // バッジを表示
        function renderBadges() {
            const listElement = document.getElementById('badgesList');
            
            if (badges.length === 0) {
                listElement.innerHTML = '<div class="empty-state">バッジがありません</div>';
                return;
            }

            listElement.innerHTML = badges.map(badge => `
                <div class="badge-item">
                    <div class="badge-preview" style="background: ${badge.color}">
                        ${badge.label}
                    </div>
                    <div class="badge-info">
                        <div class="badge-id">ID: ${badge.id}</div>
                        <div class="badge-label">${badge.label}</div>
                    </div>
                    <div class="badge-actions">
                        <button class="btn btn-edit" onclick="editBadge('${badge.id}')">編集</button>
                        <button class="btn btn-danger" onclick="deleteBadge('${badge.id}')">削除</button>
                    </div>
                </div>
            `).join('');
        }

        // 編集
        function editBadge(id) {
            const badge = badges.find(b => b.id === id);
            if (!badge) return;

            editingId = id;
            
            document.getElementById('badgeId').value = badge.id;
            document.getElementById('badgeId').disabled = true; // IDは変更不可
            document.getElementById('badgeLabel').value = badge.label;
            document.getElementById('badgeColor').value = badge.color;

            document.getElementById('formTitle').textContent = '編集';
            document.getElementById('submitBtn').textContent = '更新する';
            document.getElementById('cancelBtn').style.display = 'inline-block';

            // フォームまでスクロール
            document.querySelector('.add-section').scrollIntoView({ behavior: 'smooth' });
        }

        // 削除
        async function deleteBadge(id) {
            if (!confirm('このバッジを削除しますか?\n※既に使用している更新履歴には影響しません')) return;

            badges = badges.filter(b => b.id !== id);

            // サーバーに保存
            try {
                const response = await fetch('/api/tutor/badges', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ action: 'save', data: badges })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('削除しました', 'success');
                    renderBadges();
                } else {
                    showMessage('削除に失敗しました', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('削除中にエラーが発生しました', 'error');
            }
        }

        // 編集キャンセル
        function cancelEdit() {
            resetForm();
        }

        // フォームリセット
        function resetForm() {
            editingId = null;
            document.getElementById('badgeForm').reset();
            document.getElementById('badgeId').disabled = false;
            document.getElementById('formTitle').textContent = '新規追加';
            document.getElementById('submitBtn').textContent = '追加する';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('editId').value = '';
        }

        // メッセージ表示
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.className = `message message-${type}`;
            messageEl.textContent = text;
            messageEl.style.display = 'block';

            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
