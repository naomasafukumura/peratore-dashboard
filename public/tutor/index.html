<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ペラトレ講師ポータル</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background: #F8F9FA;
            min-height: 100vh;
            color: #333;
            font-size: 16px;
            line-height: 1.8;
        }

        /* ヘッダー */
        .site-header {
            background: rgba(255, 255, 255, 0.98);
            border-bottom: 2px solid #667eea;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 32px;
        }
        
        .header-left {
            flex-shrink: 0;
        }
        
        .header-center {
            display: flex;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }
        
        .header-right {
            flex-shrink: 0;
        }

        .site-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #1F2937;
            transition: all 0.3s;
        }

        .site-logo:hover {
            transform: translateY(-1px);
        }

        .site-logo-icon {
            font-size: 26px;
            filter: drop-shadow(0 2px 4px rgba(102, 126, 234, 0.3));
        }

        .site-logo h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .search-box {
            position: relative;
            width: 260px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 14px;
            border: 2px solid #E0E7FF;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            background: #FAFAFA;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 16px;
        }

        .main-menu-link {
            padding: 0 18px;
            text-decoration: none;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
            height: 100%;
            position: relative;
        }

        .main-menu-link:hover {
            color: #667eea;
            border-bottom-color: #E0E7FF;
        }

        .main-menu-link.active {
            color: #667eea;
            font-weight: 700;
            border-bottom-color: #667eea;
        }

        .main-menu-link.active::before {
            content: '●';
            position: absolute;
            left: 4px;
            font-size: 8px;
            color: #667eea;
        }

        /* メインコンテンツ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* 更新履歴セクション */
        .updates-section {
            background: #fff;
            border-radius: 14px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            margin-bottom: 32px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .updates-header {
            padding: 12px 24px;
            background: #FAFAFA;
            border-bottom: 2px solid rgba(102, 126, 234, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .updates-icon {
            font-size: 20px;
        }

        .updates-title {
            font-size: 17px;
            font-weight: 700;
            color: #667eea;
        }

        .update-item {
            display: flex;
            gap: 16px;
            padding: 12px 24px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .update-item:hover {
            background: #F8F9FA;
        }
        
        .update-detail-toggle {
            margin-left: 8px;
            font-size: 11px;
            color: #764ba2;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .update-detail-toggle:hover {
            color: #667eea;
        }
        
        .update-detail {
            margin-top: 8px;
            padding-top: 8px;
            color: #6B7280;
            font-size: 13px;
            line-height: 1.6;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .update-detail.show {
            max-height: 500px;
        }

        .update-date {
            font-size: 12px;
            font-weight: 700;
            color: #764ba2;
            min-width: 85px;
            padding-top: 1px;
        }

        .update-content {
            flex: 1;
        }

        .update-title {
            font-size: 14px;
            font-weight: 700;
            color: #1F2937;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .update-badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 10px;
            font-weight: 700;
            border-radius: 5px;
            letter-spacing: 0.3px;
        }

        .more-link {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            text-decoration: none;
            color: #667eea;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 24px;
            transition: all 0.3s;
            background: #FAFAFA;
            border-top: 2px solid rgba(102, 126, 234, 0.15);
        }

        .more-link:hover {
            background: #F8F9FA;
        }

        .more-link::after {
            content: '→';
            font-size: 16px;
            font-weight: 700;
        }

        /* カードグリッド */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (min-width: 768px) {
            .card-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .card-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 0;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid rgba(102, 126, 234, 0.2);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(102, 126, 234, 0.25);
            border-color: #667eea;
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            min-height: 140px;
            gap: 12px;
        }

        .card-icon {
            font-size: 48px;
            transition: all 0.4s;
            filter: drop-shadow(0 2px 4px rgba(102, 126, 234, 0.2));
        }

        .card:hover .card-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #1F2937;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .card-arrow {
            position: absolute;
            bottom: 14px;
            right: 14px;
            font-size: 18px;
            color: #667eea;
            font-weight: 700;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.4s;
        }

        .card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* 検索結果 */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 2px solid #667eea;
            border-radius: 12px;
            margin-top: 6px;
            max-height: 450px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.25);
            display: none;
            z-index: 1000;
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 14px 18px;
            cursor: pointer;
            border-bottom: 1px solid #F3F4FF;
            transition: all 0.2s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: #F8F9FA;
        }

        .search-result-title {
            font-size: 15px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 6px;
        }

        .search-result-excerpt {
            font-size: 13px;
            color: #6B7280;
            line-height: 1.5;
        }

        .search-result-highlight {
            background: #E8EBFF;
            color: #667eea;
            font-weight: 600;
            padding: 1px 3px;
            border-radius: 3px;
        }

        .no-results {
            padding: 24px;
            text-align: center;
            color: #9CA3AF;
            font-size: 14px;
        }

        /* フッター */
        .site-footer {
            background: #fff;
            border-top: 2px solid rgba(102, 126, 234, 0.2);
            margin-top: 48px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-contact {
            font-size: 14px;
            color: #6B7280;
        }

        .footer-contact strong {
            color: #667eea;
            font-weight: 700;
        }

        .footer-copyright {
            font-size: 14px;
            color: #9CA3AF;
        }

        /* レスポンシブ */
        @media (max-width: 767px) {
            .header-content {
                flex-wrap: wrap;
                height: auto;
                padding: 14px 18px;
            }

            .header-center {
                order: 3;
                width: 100%;
                margin-top: 8px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            .header-center::-webkit-scrollbar {
                display: none;
            }

            .main-menu-link {
                padding: 8px 14px;
                font-size: 13px;
                border-bottom-width: 2px;
            }

            .search-box {
                order: 2;
                width: 200px;
            }

            .search-box input {
                font-size: 13px;
                padding: 8px 36px 8px 12px;
            }

            .container {
                padding: 24px 18px;
            }

            .updates-section {
                margin-bottom: 24px;
            }

            .update-item {
                flex-direction: column;
                gap: 8px;
                padding: 12px 18px;
            }

            .update-date {
                min-width: auto;
            }

            .more-link {
                position: static;
                display: inline-flex;
                margin: 14px 18px;
            }

            .card-grid {
                gap: 16px;
            }

            .site-footer {
                margin-top: 40px;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
                gap: 12px;
            }
        }
    </style>
</head>

    <script>
        // バッジ定義（色とラベル）
        const badges = [
            { id: 'update', label: '更新', color: '#667eea' },      // 紫（サイトカラー）
            { id: 'important', label: '重要', color: '#DC2626' },   // 赤
            { id: 'info', label: 'お知らせ', color: '#313131' }    // 黒
        ];

        // 更新履歴データを保持
        let allUpdates = [];

        // バッジスタイルを動的に生成
        function generateBadgeStyles() {
            const existingStyle = document.getElementById('dynamic-badge-styles');
            if (existingStyle) {
                existingStyle.remove();
            }

            const styleEl = document.createElement('style');
            styleEl.id = 'dynamic-badge-styles';
            styleEl.textContent = badges.map(badge => `
                .badge-${badge.id} {
                    background: ${badge.color};
                    color: #fff;
                }
            `).join('\n');
            document.head.appendChild(styleEl);
        }

        // 更新履歴を読み込み
        async function loadUpdates() {
            try {
                const response = await fetch('/api/tutor/updates?action=get');
                const data = await response.json();
                
                if (data.success) {
                    allUpdates = data.data || [];
                    renderUpdates();
                }
            } catch (error) {
                console.error('Error loading updates:', error);
            }
        }

        // 更新履歴を表示（最新2件のみ）
        function renderUpdates() {
            const listElement = document.getElementById('updatesList');
            const moreLink = document.getElementById('moreLink');
            
            if (allUpdates.length === 0) {
                listElement.innerHTML = '<div style="padding: 24px; text-align: center; color: #9CA3AF;">更新履歴がありません</div>';
                moreLink.style.display = 'none';
                return;
            }

            // 最新2件のみ表示
            const displayUpdates = allUpdates.slice(0, 2);

            listElement.innerHTML = displayUpdates.map((update, index) => {
                // バッジ配列を処理（古いデータはbadge文字列の可能性があるので対応）
                const badgeArray = Array.isArray(update.badges) ? update.badges : (update.badge ? [update.badge] : []);
                const badgesHtml = badgeArray.map(badgeId => 
                    `<span class="update-badge badge-${badgeId}">${getBadgeText(badgeId)}</span>`
                ).join('');

                return `
                    <div class="update-item" onclick="toggleDetail(${index})">
                        <div class="update-date">${update.date}</div>
                        <div class="update-content">
                            <div class="update-title">
                                ${update.title}
                                ${badgesHtml}
                                ${update.detail ? '<span class="update-detail-toggle">詳細を確認 ▼</span>' : ''}
                            </div>
                            ${update.detail ? `<div class="update-detail" id="detail-${index}">${update.detail}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            // もっと見るリンクの表示制御
            if (allUpdates.length > 2) {
                moreLink.style.display = 'flex';
                moreLink.textContent = 'もっと見る';
            } else {
                moreLink.style.display = 'none';
            }
            
            showingAll = false;
        }

        // バッジテキスト取得
        function getBadgeText(badgeId) {
            const badge = badges.find(b => b.id === badgeId);
            return badge ? badge.label : badgeId;
        }

        // 詳細の開閉
        function toggleDetail(index) {
            const detailElement = document.getElementById(`detail-${index}`);
            if (detailElement) {
                detailElement.classList.toggle('show');
            }
        }

        // もっと見るリンクのクリックイベント
        let showingAll = false;
        document.getElementById('moreLink').addEventListener('click', function(e) {
            e.preventDefault();
            
            if (!showingAll) {
                // 全件表示
                const listElement = document.getElementById('updatesList');
                listElement.innerHTML = allUpdates.map((update, index) => {
                    // バッジ配列を処理（古いデータはbadge文字列の可能性があるので対応）
                    const badgeArray = Array.isArray(update.badges) ? update.badges : (update.badge ? [update.badge] : []);
                    const badgesHtml = badgeArray.map(badgeId => 
                        `<span class="update-badge badge-${badgeId}">${getBadgeText(badgeId)}</span>`
                    ).join('');

                    return `
                        <div class="update-item" onclick="toggleDetail(${index})">
                            <div class="update-date">${update.date}</div>
                            <div class="update-content">
                                <div class="update-title">
                                    ${update.title}
                                    ${badgesHtml}
                                    ${update.detail ? '<span class="update-detail-toggle">詳細を確認 ▼</span>' : ''}
                                </div>
                                ${update.detail ? `<div class="update-detail" id="detail-${index}">${update.detail}</div>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
                
                this.textContent = '閉じる';
                showingAll = true;
            } else {
                // 最新2件のみ表示に戻す
                renderUpdates();
                showingAll = false;
            }
        });

        // 全文検索機能
        document.addEventListener("DOMContentLoaded", function() {

        // ページ読み込み時に検索語にスクロール＆ハイライト
        const urlParams = new URLSearchParams(window.location.search);
        const searchQuery = urlParams.get('q');
        
        if (searchQuery) {
            setTimeout(function() {
                const bodyText = document.body.innerText.toLowerCase();
                const searchLower = searchQuery.toLowerCase();
                
                if (bodyText.includes(searchLower)) {
                    const walker = document.createTreeWalker(
                        document.body,
                        NodeFilter.SHOW_TEXT,
                        null,
                        false
                    );
                    
                    let node;
                    let found = false;
                    
                    while (node = walker.nextNode()) {
                        const text = node.textContent;
                        const textLower = text.toLowerCase();
                        const index = textLower.indexOf(searchLower);
                        
                        if (index !== -1 && !found) {
                            const parent = node.parentElement;
                            if (parent) {
                                const style = document.createElement('style');
                                style.textContent = '.search-highlight { background-color: #fff59d; padding: 2px 4px; border-radius: 3px; animation: highlight-fade 2s ease-in-out; } @keyframes highlight-fade { 0% { background-color: #ffeb3b; } 100% { background-color: #fff59d; } }';
                                document.head.appendChild(style);
                                
                                const beforeText = text.substring(0, index);
                                const matchText = text.substring(index, index + searchQuery.length);
                                const afterText = text.substring(index + searchQuery.length);
                                
                                const span = document.createElement('span');
                                span.innerHTML = beforeText + '<span class="search-highlight">' + matchText + '</span>' + afterText;
                                node.replaceWith(span);
                                
                                setTimeout(function() {
                                    const highlight = document.querySelector('.search-highlight');
                                    if (highlight) {
                                        highlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    }
                                }, 100);
                                
                                found = true;
                            }
                        }
                    }
                }
            }, 500);
        }
        const searchInput = document.getElementById('searchInput');
        const searchIcon = document.querySelector('.search-icon');

        // Enterキーで検索結果ページへ遷移
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearchNavigation();
            }
        });

        // 虫眼鏡アイコンクリックで検索結果ページへ遷移
        searchIcon.addEventListener('click', function() {
            performSearchNavigation();
        });

        function performSearchNavigation() {
            const query = searchInput.value.trim();
            if (query) {
                window.location.href = `search-results.html?q=${encodeURIComponent(query)}`;
            }
        }

        });
        // 初期化
        generateBadgeStyles();
        loadUpdates();
    </script>
</body>
</html>
